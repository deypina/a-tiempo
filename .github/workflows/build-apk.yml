name: Compilar APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas unitarias
        run: ./gradlew testDebugUnitTest

      - name: Compilar APK de prueba (debug)
        run: ./gradlew assembleDebug

      - name: Subir APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: a-tiempo-apk
          path: app/build/outputs/apk/debug/*.apk

      # --- Solo al publicar una versión (etiqueta v*) ---
      - name: Preparar llave de firma
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Falta el secreto KEYSTORE_BASE64. Revisa la Fase 6 del plan." && exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Compilar APK firmado (release)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "A-Tiempo-${GITHUB_REF_NAME}.apk"

      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: A-Tiempo-*.apk
          generate_release_notes: true
