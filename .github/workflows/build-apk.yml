name: Compilar APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Least privilege: read-only by default. Only the release job can write (to publish).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a full commit SHA so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      # Also verifies that gradle-wrapper.jar is an official Gradle release.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Same debug key on every run, so a new test APK installs over the previous one
      # without deleting data. Without the secret (e.g. pull requests from forks) Gradle makes a random key.
      - name: Usar la llave fija de las versiones de prueba
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
          else
            echo "Sin DEBUG_KEYSTORE_BASE64: la versión de prueba usará una llave nueva."
          fi

      - name: Pruebas unitarias
        run: ./gradlew testDebugUnitTest

      - name: Revisión de calidad (lint)
        run: ./gradlew lintDebug

      - name: Compilar APK de prueba (debug)
        run: ./gradlew assembleDebug

      - name: Verificar que la app no pide internet
        run: ./scripts/check-no-internet.sh app/build/outputs/apk/debug/app-debug.apk

      # The release build shrinks the code with R8. Building it on every push (unsigned)
      # catches R8 problems before a version is tagged.
      - name: Compilar versión final sin firmar (revisa R8)
        run: |
          ./gradlew assembleRelease
          ./scripts/check-no-internet.sh app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Subir APK de prueba
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a-tiempo-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Subir esquema de la base de datos
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: ignore

  # End-to-end tests: the real app on an Android emulator (app/src/androidTest).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Hardware acceleration so the emulator runs at a usable speed.
      - name: Activar aceleración del emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Pruebas de punta a punta en emulador
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest

      - name: Subir informe de las pruebas
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/connected/

  # --- Only when publishing a version (tag v*) ---
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Preparar llave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Falta el secreto KEYSTORE_BASE64. Revisa la Fase 6 del plan." && exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Compilar APK firmado (release)
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          # Fixed name: the download page links to releases/latest/download/A-Tiempo.apk.
          cp app/build/outputs/apk/release/app-release.apk A-Tiempo.apk

      - name: Borrar llave de firma del equipo de compilación
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Verificar que la app no pide internet
        run: ./scripts/check-no-internet.sh A-Tiempo.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: A-Tiempo.apk
          generate_release_notes: true
          # Test versions (v1.0.0-rc1) are marked as pre-release, so the download page,
          # which links to releases/latest, keeps offering the last final version.
          prerelease: ${{ contains(github.ref_name, '-rc') }}
